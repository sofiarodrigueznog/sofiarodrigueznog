# Redibuja el calendario de contribuciones y lo publica solo si cambió.
#
# Permisos mínimos (contents: write) y ninguna credencial extra: los datos
# vienen del calendario público de GitHub, sin token y sin servicios externos.
# El push lo hace GITHUB_TOKEN, que por diseño no vuelve a disparar workflows,
# y los filtros de `paths` excluyen lo que este job escribe: no hay bucle.

name: actividad

on:
  schedule:
    - cron: "17 6 * * *" # una vez al día, en un minuto poco concurrido
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "data/profile.json"
      - ".github/workflows/activity.yml"

permissions:
  contents: write

concurrency:
  group: actividad
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Generar recursos
        run: python3 scripts/build.py

      - name: Publicar si hay cambios
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets data
          if git diff --cached --quiet; then
            echo "Sin cambios en la actividad."
            exit 0
          fi
          git commit -m "actividad: calendario al $(date -u +%F)"
          git push
